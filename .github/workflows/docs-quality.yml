name: docs-quality

on:
  push:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-quality.yml"
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "scripts/validate_docs.py"
      - ".github/workflows/docs-quality.yml"

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate docs
        run: python scripts/validate_docs.py
